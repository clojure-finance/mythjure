# CI (direction doc §5.1 item 4): the dependency-free base suite on every
# push, and the torch suite across a small compatibility matrix of
# Python × torch (CPU wheels). The MNIST example test self-skips without its
# cached download, so nothing here touches the network beyond installs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  base:
    name: base suite (pure Clojure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: DeLaGuardo/setup-clojure@13.4
        with: {cli: latest}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-${{ hashFiles('deps.edn') }}
      - run: clojure -M:test

  torch:
    name: torch suite (py ${{ matrix.python }} / torch ${{ matrix.torch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
        torch: ['2.9.1', '2.13.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: DeLaGuardo/setup-clojure@13.4
        with: {cli: latest}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-${{ hashFiles('deps.edn') }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python }}-torch-${{ matrix.torch }}
      # numpy explicitly: it is NOT a torch dependency (the ingest-lane tests
      # need it), CPU wheels keep the download small.
      - run: pip install torch==${{ matrix.torch }} numpy --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: clojure -M:test-torch
