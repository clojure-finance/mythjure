# Reproduction gates (manual): rerun the torch-backend reproduction scripts
# and diff against the paper's recorded .edns, which are pinned at the
# paper-v1 tag (untracked on main), so they are checked out from the tag
# first. ~10 min of compute — dispatch by hand (e.g. after a torch upgrade)
# rather than per push. Each script exits non-zero on any section mismatch.
name: reproduction gates

on:
  workflow_dispatch:
    inputs:
      torch-version:
        description: torch version to validate against
        default: '2.13.0'

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: fetch the recorded .edns from the paper-v1 tag
        run: |
          git fetch --depth=1 origin tag paper-v1
          git checkout paper-v1 -- scripts/seed_verify.edn scripts/spectral.edn
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: DeLaGuardo/setup-clojure@13.4
        with: {cli: latest}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-${{ hashFiles('deps.edn') }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install torch==${{ inputs.torch-version }} numpy --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: clojure -M:torch scripts/seed_verify_torch.clj
      - run: clojure -M:torch scripts/spectral_torch.clj
